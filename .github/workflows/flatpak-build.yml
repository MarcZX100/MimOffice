name: Build Flatpak

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      # bilelmoussaoui/flatpak-github-actions was superseded by flathub-infra's own images;
      # the old Docker Hub repo stopped publishing past kde-6.7.
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build MimOffice Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: mimoffice.flatpak
          manifest-path: org.mimoslinux.MimOffice.json
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimoffice-flatpak
          path: mimoffice.flatpak
          retention-days: 14

  deb:
    # Ubuntu 24.04 (the GitHub-hosted runner image) still ships KDE Frameworks 5, so it can't
    # build MimOffice natively. Debian trixie (current stable) ships KF6 out of the box, so we
    # build .deb and the portable tarball there instead, via a container job on top of the
    # regular ubuntu-latest runner (same pattern as the flatpak job above).
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install git (needed for checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Install required build dependencies
        run: |
          apt-get update
          apt-get install -y \
            extra-cmake-modules cmake ninja-build build-essential dpkg-dev perl zlib1g-dev \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-tools-dev \
            libkf6archive-dev libkf6completion-dev libkf6config-dev libkf6configwidgets-dev \
            libkf6coreaddons-dev libkf6crash-dev libkf6guiaddons-dev libkf6i18n-dev \
            libkf6iconthemes-dev libkf6itemviews-dev libkf6jobwidgets-dev libkf6kcmutils-dev \
            libkf6kio-dev libkf6notifications-dev libkf6notifyconfig-dev libkf6sonnet-dev \
            libkf6textwidgets-dev libkf6widgetsaddons-dev libkf6windowsystem-dev libkf6xmlgui-dev \
            kirigami-addons-dev qtkeychain-qt6-dev libboost-dev libssl-dev

      - name: Install optional build dependencies (best-effort, gate optional CMake features)
        run: |
          apt-get update
          for pkg in librevenge-dev libodfgen-dev libvisio-dev libwpd-dev libwpg-dev libwps-dev \
                     libpoppler-qt6-dev libetonyek-dev libcdr-dev libmspub-dev libeigen3-dev \
                     libsecret-1-dev libgsl-dev liblcms2-dev libkchart-dev libqca-qt6-dev; do
            apt-get install -y "$pkg" || echo "::warning::optional package $pkg not available, skipping"
          done

      - name: Configure
        run: cmake --preset mimoffice-package

      - name: Build
        run: cmake --build --preset mimoffice-package

      - name: Package .deb and tarball
        run: cd build && cpack -G "DEB;TGZ"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimoffice-deb
          path: build/*.deb
          retention-days: 14

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimoffice-tarball
          path: build/*.tar.gz
          retention-days: 14

  rpm:
    # Fedora ships KF6 natively, so the .rpm is built there rather than on Ubuntu/Debian.
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Install git (needed for checkout)
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Install required build dependencies
        run: |
          dnf install -y \
            cmake extra-cmake-modules ninja-build gcc-c++ rpm-build redhat-rpm-config \
            perl-interpreter zlib-devel \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel qt6-qttools-devel \
            kf6-karchive-devel kf6-kcompletion-devel kf6-kconfig-devel kf6-kconfigwidgets-devel \
            kf6-kcoreaddons-devel kf6-kcrash-devel kf6-kguiaddons-devel kf6-ki18n-devel \
            kf6-kiconthemes-devel kf6-kitemviews-devel kf6-kjobwidgets-devel kf6-kcmutils-devel \
            kf6-kio-devel kf6-knotifications-devel kf6-knotifyconfig-devel kf6-sonnet-devel \
            kf6-ktextwidgets-devel kf6-kwidgetsaddons-devel kf6-kwindowsystem-devel kf6-kxmlgui-devel \
            kf6-kirigami-addons-devel qtkeychain-qt6-devel boost-devel openssl-devel

      - name: Install optional build dependencies (best-effort, gate optional CMake features)
        run: |
          for pkg in librevenge-devel libodfgen-devel libvisio-devel libwpd-devel libwpg-devel \
                     libwps-devel poppler-qt6-devel libetonyek-devel libcdr-devel libmspub-devel \
                     eigen3-devel libsecret-devel gsl-devel lcms2-devel kf6-kdiagram-devel \
                     qt6-qca-devel; do
            dnf install -y "$pkg" || echo "::warning::optional package $pkg not available, skipping"
          done

      - name: Configure
        run: cmake --preset mimoffice-package

      - name: Build
        run: cmake --build --preset mimoffice-package

      - name: Package .rpm
        run: cd build && cpack -G RPM

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimoffice-rpm
          path: build/*.rpm
          retention-days: 14

  appimage:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install git (needed for checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl file

      - uses: actions/checkout@v4

      - name: Install required build dependencies
        run: |
          apt-get update
          apt-get install -y \
            extra-cmake-modules cmake ninja-build build-essential perl zlib1g-dev \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-tools-dev \
            libkf6archive-dev libkf6completion-dev libkf6config-dev libkf6configwidgets-dev \
            libkf6coreaddons-dev libkf6crash-dev libkf6guiaddons-dev libkf6i18n-dev \
            libkf6iconthemes-dev libkf6itemviews-dev libkf6jobwidgets-dev libkf6kcmutils-dev \
            libkf6kio-dev libkf6notifications-dev libkf6notifyconfig-dev libkf6sonnet-dev \
            libkf6textwidgets-dev libkf6widgetsaddons-dev libkf6windowsystem-dev libkf6xmlgui-dev \
            kirigami-addons-dev qtkeychain-qt6-dev libboost-dev libssl-dev

      - name: Install optional build dependencies (best-effort, gate optional CMake features)
        run: |
          apt-get update
          for pkg in librevenge-dev libodfgen-dev libvisio-dev libwpd-dev libwpg-dev libwps-dev \
                     libpoppler-qt6-dev libetonyek-dev libcdr-dev libmspub-dev libeigen3-dev \
                     libsecret-1-dev libgsl-dev liblcms2-dev libkchart-dev libqca-qt6-dev; do
            apt-get install -y "$pkg" || echo "::warning::optional package $pkg not available, skipping"
          done

      - name: Configure
        run: cmake --preset mimoffice-package

      - name: Build
        run: cmake --build --preset mimoffice-package

      - name: Install into AppDir
        run: cmake --install build --prefix "$PWD/AppDir/usr"

      - name: Fetch linuxdeploy
        run: |
          curl -L -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        # No FUSE inside a container, so extract-and-run instead of mounting the tool AppImages.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QMAKE: /usr/lib/qt6/bin/qmake
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/calligralauncher \
            --desktop-file AppDir/usr/share/applications/org.kde.calligra.desktop \
            --icon-file words/app/org.kde.calligra.words.svg \
            --icon-filename org.kde.calligra.words \
            --plugin qt --output appimage
          mv MimOffice*.AppImage MimOffice-x86_64.AppImage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimoffice-appimage
          path: MimOffice-x86_64.AppImage
          retention-days: 14

  snap:
    # Recipe lives in snap/snapcraft.yaml, using the kde-neon-6 extension so the KF6/Qt6
    # runtime is pulled in from the shared kf6-core24 content snap rather than bundled here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build snap
        id: snapcraft
        uses: snapcore/action-build@v1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimoffice-snap
          path: ${{ steps.snapcraft.outputs.snap }}
          retention-days: 14

  release:
    needs: [flatpak, deb, rpm, appimage, snap]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mimoffice-*
          merge-multiple: true

      - name: Move "latest" tag to this commit
        run: |
          git tag -f latest
          git push origin refs/tags/latest --force

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MimOffice (latest build)
          body: |
            Automatically built from the latest `main` commit (${{ github.sha }}).

            ## Install

            **Flatpak** (recommended, works on any distro):
            1. Download `mimoffice.flatpak` below.
            2. `flatpak install --user mimoffice.flatpak` (or double-click it in GNOME Software / KDE Discover).
            3. Run with `flatpak run org.mimoslinux.MimOffice`.

            **.deb** (Debian, Ubuntu, and MimOS):
            1. Download `mimoffice_*_amd64.deb` below.
            2. `sudo apt install ./mimoffice_*_amd64.deb` (or `sudo dpkg -i` followed by `sudo apt --fix-broken install` to pull in dependencies).

            **.rpm** (Fedora, openSUSE, RHEL):
            1. Download `mimoffice-*.rpm` below.
            2. `sudo dnf install ./mimoffice-*.rpm` (or `sudo zypper install ./mimoffice-*.rpm`).

            **Snap** (any distro with snapd):
            1. Download `mimoffice_*.snap` below.
            2. `sudo snap install --dangerous mimoffice_*.snap` (`--dangerous` because this build isn't signed by the Snap Store).

            **AppImage** (portable, no install needed):
            1. Download `MimOffice-x86_64.AppImage` below.
            2. `chmod +x MimOffice-x86_64.AppImage && ./MimOffice-x86_64.AppImage`.

            **Tarball** (manual/system-wide install, any distro):
            1. Download `mimoffice-*-Linux.tar.gz` below.
            2. `sudo tar -xzf mimoffice-*-Linux.tar.gz -C /` (installs under `/usr`, same layout as the .deb/.rpm).
          files: |
            mimoffice.flatpak
            *.deb
            *.rpm
            *.tar.gz
            *.snap
            MimOffice-x86_64.AppImage
          make_latest: true
          prerelease: false
