name: mimoffice
base: core24
version: '26.08.0'
summary: MimOffice office suite — Words, Sheets, Stage, Karbon
description: |
  MimOffice is a KDE Frameworks-based office suite forked from Calligra,
  bundling Words (word processor), Sheets (spreadsheet), Stage
  (presentations), and Karbon (vector graphics).
license: LGPL-2.0-or-later AND GPL-2.0-or-later
grade: stable
confinement: strict

apps:
  mimoffice:
    command: usr/bin/calligralauncher
    common-id: org.kde.calligra.desktop
    desktop: usr/share/applications/org.kde.calligra.desktop
    extensions: [kde-neon-6]
    plugs:
      - home
      - removable-media

parts:
  mimoffice:
    plugin: cmake
    source: .
    cmake-generator: Ninja
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DPRODUCTSET=WORDS;SHEETS;STAGE;KARBON
      - -DBUILD_TESTING=OFF
    # The kde-neon-6 extension pulls in the kf6-core24-sdk and kde-qt6-core24-sdk build-snaps,
    # which already provide ECM, Qt6, and every KF6 framework at build time (and their runtime
    # counterparts via the kf6-core24 content snap) — so only genuine third-party libs that
    # those SDKs don't cover need to be listed here. kdiagram/qca are left out: they're
    # optional (CalligraProducts.cmake features) and not reliably named on core24, so the
    # build just skips those two features rather than failing outright.
    build-packages:
      - kirigami-addons-dev
      - libboost-dev
      - qtkeychain-qt6-dev
      - liblcms2-dev
      - librevenge-dev
      - libodfgen-dev
      - libvisio-dev
      - libwpd-dev
      - libwpg-dev
      - libwps-dev
      - libpoppler-qt6-dev
      - libetonyek-dev
      - libcdr-dev
      - libmspub-dev
      - libeigen3-dev
      - libsecret-1-dev
      - libgsl-dev
      - libssl-dev
